name: UnvibeCode Automated Code Review

on:
  pull_request:
    branches: [ "main", "master" ]
    types: [ opened, synchronize, reopened ]

jobs:
  unvibecode-review:
    name: Run UnvibeCode Analysis
    runs-on: ubuntu-latest
    
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install UnvibeCode CLI
        run: |
          python -m pip install --upgrade pip
          pip install unvibecode

      - name: Run UnvibeCode Repository Review (Dry Run)
        run: |
          echo "Starting local dry-run repository review..."
          python -m unvibecode review --repository . --output unvibecode_results --dry-run --no-open-browser

      - name: Archive Review Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unvibecode-review-report
          path: unvibecode_results/
          retention-days: 14

      - name: Comment PR with Review Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let commentBody = '## 🛡️ UnvibeCode Architecture & Risk Review (Dry Run)\n\n';
            commentBody += 'Local static analysis completed successfully for this pull request.\n\n';
            
            const resultsDir = path.join(process.env.GITHUB_WORKSPACE, 'unvibecode_results');
            if (fs.existsSync(resultsDir)) {
              const files = fs.readdirSync(resultsDir);
              const htmlReport = files.find(f => f.endsWith('-unvibecode-full.html') || f.endsWith('.html') || files.length > 0);
              
              if (htmlReport) {
                commentBody += `📊 **Review Artifacts:** Generated and uploaded successfully as workflow artifact (\`unvibecode-review-report\`).\n`;
              } else {
                commentBody += `⚠️ Review job completed, but output files were empty.\n`;
              }
            } else {
              commentBody += `❌ **Status:** Review process failed to generate output results.\n`;
            }

            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull_number,
            });
            
            const existingComment = comments.data.find(c => c.user.type === 'Bot' && c.body.includes('UnvibeCode Architecture & Risk Review'));
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body: commentBody,
              });
            }
